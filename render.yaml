# Render Blueprint de GameGo (plan Free): 6 Web Services de backend + 1 sitio estÃ¡tico (frontend).
# Reemplazar javiera01 por un identificador corto y Ãºnico (minÃºsculas, sin espacios).
# Eureka se conserva para Docker local, pero se desactiva en Render Free.
services:
  - type: web
    name: javiera01-gamego-cliente
    runtime: docker
    plan: free
    dockerfilePath: ./backend/render/docker/cliente-service.Dockerfile
    dockerContext: ./backend
    healthCheckPath: /actuator/health
    envVars:
      - key: EUREKA_ENABLED
        value: false

  - type: web
    name: javiera01-gamego-producto
    runtime: docker
    plan: free
    dockerfilePath: ./backend/render/docker/producto-service.Dockerfile
    dockerContext: ./backend
    healthCheckPath: /actuator/health
    envVars:
      - key: EUREKA_ENABLED
        value: false

  - type: web
    name: javiera01-gamego-pedido
    runtime: docker
    plan: free
    dockerfilePath: ./backend/render/docker/pedido-service.Dockerfile
    dockerContext: ./backend
    healthCheckPath: /actuator/health
    envVars:
      - key: EUREKA_ENABLED
        value: false
      - key: APP_DISCOVERY_ENABLED
        value: false
      - key: CLIENTE_SERVICE_URL
        value: https://javiera01-gamego-cliente.onrender.com
      - key: PRODUCTO_SERVICE_URL
        value: https://javiera01-gamego-producto.onrender.com

  - type: web
    name: javiera01-gamego-pago
    runtime: docker
    plan: free
    dockerfilePath: ./backend/render/docker/pago-service.Dockerfile
    dockerContext: ./backend
    healthCheckPath: /actuator/health
    envVars:
      - key: EUREKA_ENABLED
        value: false
      - key: APP_DISCOVERY_ENABLED
        value: false
      - key: PEDIDO_SERVICE_URL
        value: https://javiera01-gamego-pedido.onrender.com

  - type: web
    name: javiera01-gamego-despacho
    runtime: docker
    plan: free
    dockerfilePath: ./backend/render/docker/despacho-service.Dockerfile
    dockerContext: ./backend
    healthCheckPath: /actuator/health
    envVars:
      - key: EUREKA_ENABLED
        value: false
      - key: APP_DISCOVERY_ENABLED
        value: false
      - key: PEDIDO_SERVICE_URL
        value: https://javiera01-gamego-pedido.onrender.com

  - type: web
    name: javiera01-gamego-gateway
    runtime: docker
    plan: free
    dockerfilePath: ./backend/render/docker/api-gateway.Dockerfile
    dockerContext: ./backend
    healthCheckPath: /actuator/health
    envVars:
      - key: EUREKA_ENABLED
        value: false
      - key: CLIENTE_SERVICE_URL
        value: https://javiera01-gamego-cliente.onrender.com
      - key: PRODUCTO_SERVICE_URL
        value: https://javiera01-gamego-producto.onrender.com
      - key: PEDIDO_SERVICE_URL
        value: https://javiera01-gamego-pedido.onrender.com
      - key: PAGO_SERVICE_URL
        value: https://javiera01-gamego-pago.onrender.com
      - key: DESPACHO_SERVICE_URL
        value: https://javiera01-gamego-despacho.onrender.com
      - key: CORS_ALLOWED_ORIGINS
        value: https://javiera01-gamego-web.onrender.com

  # Frontend (React + Vite) publicado como sitio estÃ¡tico.
  # VITE_API_URL se lee al compilar y apunta al gateway.
  - type: web
    name: javiera01-gamego-web
    runtime: static
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: NODE_VERSION
        value: 22.12.0
      - key: VITE_API_URL
        value: https://javiera01-gamego-gateway.onrender.com

